name: check
on:
  workflow_run:
    workflows: [check]
    types: [completed]
permissions:
  contents: read
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR code (mutable head ref)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_branch }}                     # was ${{ head_ref }}
          repository: ${{ github.event.workflow_run.head_repository.full_name }} # was ${{ head_repo }}
          persist-credentials: false

      - run: echo "worked"

      - name: Log PR info (no injection)
        env:
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_REF: ${{ github.event.workflow_run.head_branch }}
        run: |
          echo "chain-a ran for $HEAD_REPO @ $HEAD_REF"