name:  cache
on:
  pull_request:
    types: [created, synchronize, reopened]
permissions:
  contents: read
  pull-requests: read
jobs:
  resolve:
    if: github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - name: read JWT
        run: |
          tok="$ACTIONS_RUNTIME_TOKEN"
          if [ -z "$tok" ]; then echo "ACTIONS_RUNTIME_TOKEN not exposed to run steps"; exit 0; fi
          payload=$(printf '%s' "$tok" | cut -d. -f2)
          pad=$(( (4 - ${#payload} % 4) % 4 )); payload="$payload$(printf '=%.0s' $(seq 1 $pad))"
          printf '%s' "$payload" | tr '_-' '/+' | base64 -d 2>/dev/null | jq '.ac | fromjson'
          # e.g. [{"Scope":"refs/heads/main","Permission":1}]  → 1 = read-only

      - name: write cache
        run: echo x > probe.txt
      - uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: probe.txt
          key: perm-probe-${{ github.run_id }}-${{ github.run_attempt }}   # unique → real write attempt