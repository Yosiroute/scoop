name: '(job A)'

# Run this SECOND
on:
  workflow_dispatch:
    inputs:
      target_run_backend_id:
        description: "job B's workflowRunBackendId (from job-b.yml output)"
        required: true
      target_job_backend_id:
        description: "job B's workflowJobRunBackendId (from job-b.yml output)"
        required: true

jobs:
  attempt-cross-run-write:
    runs-on: ubuntu-latest
    steps:
      - name: Show this run's own backend IDs, for contrast
        run: |
          node -e "
            const jwt = process.env.ACTIONS_RUNTIME_TOKEN;
            if (!jwt) { throw new Error('ACTIONS_RUNTIME_TOKEN is not set in this job environment'); }
            const payload = JSON.parse(Buffer.from(jwt.split('.')[1], 'base64url').toString());
            const scope = payload.scp.split(' ').find(s => s.startsWith('Actions.Results:'));
            const [, workflowRunBackendId, workflowJobRunBackendId] = scope.split(':');
            console.log('This run\'s own workflowRunBackendId:    ' + workflowRunBackendId);
            console.log('This run\'s own workflowJobRunBackendId: ' + workflowJobRunBackendId);
          "

      - name: Attempt CreateArtifact with job B's IDs, authenticated as job A
        env:
          TARGET_RUN_ID: ${{ inputs.target_run_backend_id }}
          TARGET_JOB_ID: ${{ inputs.target_job_backend_id }}
        run: |
          if [ -z "${ACTIONS_RUNTIME_TOKEN:-}" ]; then
            echo "ACTIONS_RUNTIME_TOKEN is not set in this job environment" >&2
            exit 1
          fi
          if [ -z "${ACTIONS_RESULTS_URL:-}" ]; then
            echo "ACTIONS_RESULTS_URL is not set in this job environment" >&2
            exit 1
          fi

          BODY=$(node -e "
            console.log(JSON.stringify({
              workflowRunBackendId: process.env.TARGET_RUN_ID,
              workflowJobRunBackendId: process.env.TARGET_JOB_ID,
              name: 'cross-run-write-poc',
              version: 7
            }))
          ")

          HTTP_STATUS=$(curl -s -o response.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${ACTIONS_RUNTIME_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d "${BODY}" \
            "${ACTIONS_RESULTS_URL%/}/twirp/github.actions.results.api.v1.ArtifactService/CreateArtifact")

          echo "HTTP status: ${HTTP_STATUS}"
          echo "Response body:"
          cat response.json
          echo ""

          if [ "${HTTP_STATUS}" -ge 200 ] && [ "${HTTP_STATUS}" -lt 300 ]; then
            echo "::warning::Cross-run write appears to have SUCCEEDED. Do not proceed further — report to GitHub's Security Bug Bounty (bounty.github.com) instead of investigating alone."
          else
            echo "Cross-run write was rejected, as expected. Isolation held."
          fi
